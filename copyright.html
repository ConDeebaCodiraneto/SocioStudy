<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>SocioStudy — авторски права</title>
<link rel="stylesheet" href="/styles.css">
<style>
  .legal-wrap { max-width: 720px; margin: 0 auto; padding: var(--space-10) var(--space-5) var(--space-16); }
  .legal-wrap h1 { margin-bottom: var(--space-2); }
  .legal-wrap .updated { color: var(--ink-muted); font-size: var(--text-sm); margin-bottom: var(--space-8); }
  .legal-wrap section { margin-bottom: var(--space-8); }
  .legal-wrap h2 { font-size: var(--text-lg); margin-bottom: var(--space-3); }
  .legal-wrap p { max-width: 68ch; line-height: 1.6; margin-bottom: var(--space-3); }
  .contact-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-5); }
  .contact-card dt { font-weight: 600; margin-top: var(--space-3); }
  .contact-card dt:first-child { margin-top: 0; }
  .contact-card dd { margin: 0; color: var(--ink-muted); }
  .back-link { display: inline-flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-6); color: var(--ink-muted); text-decoration: none; font-size: var(--text-sm); }
  .back-link:hover { color: var(--ink); }
  .lang-switch { position: fixed; top: var(--space-5); right: var(--space-5); }
</style>
</head>
<body data-title-key="legal.titleTagCopyright">
  <button class="lang-toggle lang-switch" id="langToggle" title="Switch to English" aria-label="Switch to English">EN</button>
  <div class="legal-wrap">
    <a href="/" class="back-link">← <span data-i18n="legal.backToApp">Back to SocioStudy</span></a>
    <h1 data-i18n="legal.copyrightTitle">Copyright &amp; status of this website</h1>
    <p class="updated" data-i18n="legal.lastUpdated">Last updated: October 2026</p>

    <section>
      <p data-i18n="legal.copyrightIntro"></p>
    </section>

    <section>
      <h2 data-i18n="legal.devStatusH">Development status — restricted access</h2>
      <p data-i18n="legal.devStatusBody"></p>
      <p data-i18n="legal.noLicense"></p>
    </section>

    <section>
      <h2 data-i18n="legal.contactH">Contact &amp; author</h2>
      <dl class="contact-card">
        <dt data-i18n="legal.contactName">Author</dt>
        <dd>Mihail Hristov</dd>
        <dt data-i18n="legal.contactRole">Affiliation</dt>
        <dd data-i18n="legal.contactRoleValue"></dd>
        <dt data-i18n="legal.contactEmail">Email</dt>
        <dd><a href="mailto:msh03080h@gmail.com">msh03080h@gmail.com</a></dd>
        <dt data-i18n="legal.contactPhone">Phone</dt>
        <dd><a href="tel:+359895230748">+359 89 523 0748</a></dd>
      </dl>
    </section>

    <p class="tiny muted" data-i18n-html="legal.seePrivacy"></p>
  </div>

  <script src="/shared.js"></script>
  <script src="/i18n.js"></script>
  <script src="/legal.js"></script>
</body>
</html>
